<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>부경대학교의 미래</title>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#e8e0f7;
    --card:rgba(255,255,255,.65);
    --text:#2d1b4e;
    --accent:#7c4dff;
    --line:#b39ddb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(135deg,#ede7f6,#d1c4e9);
    font-family:'Noto Sans KR',sans-serif;
    color:var(--text);
}

body::before{
    content:"✦ ♡ ✧ ☆ ✿ ☾";
    position:fixed;
    inset:0;
    font-size:180px;
    color:rgba(124,77,255,.05);
    display:flex;
    justify-content:space-around;
    align-items:center;
    flex-wrap:wrap;
    pointer-events:none;
    z-index:-1;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.title{
    font-family:'Nanum Brush Script',cursive;
    font-size:9rem;
    color:var(--accent);
}

.subtitle{
    margin-top:20px;
    font-size:1.2rem;
    color:#5e548e;
}

.scroll{
    margin-top:60px;
    color:#7e57c2;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding-bottom:100px;
}

.section{
    margin:40px 0;
    padding:35px;
    background:var(--card);
    border-radius:25px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 25px rgba(124,77,255,.1);
}

.section-title{
    font-family:'Nanum Brush Script',cursive;
    font-size:3rem;
    color:var(--accent);
    margin-bottom:20px;
}

.weather-box{
    text-align:center;
    font-size:1.5rem;
}

.news-item{
    padding:15px;
    border-bottom:1px dashed var(--line);
}

.news-item:last-child{
    border:none;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(124,77,255,.1);
}

.card h3{
    color:var(--accent);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.stat{
    background:white;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

.stat-number{
    font-size:2.3rem;
    color:var(--accent);
    font-weight:bold;
    margin-top:10px;
}

footer{
    text-align:center;
    padding:40px;
    color:#6a5acd;
}

@media(max-width:768px){
    .title{
        font-size:4.5rem;
    }
}

</style>
</head>

<body>

<div class="hero">
    <h1 class="title">부경대학교의 미래</h1>
    <p class="subtitle">부산 · 대학 · 사회복지 · 미래 플랫폼</p>
    <div class="scroll">▼ SCROLL</div>
</div>

<div class="container">

    <div class="section">
        <div class="section-title">날씨</div>
        <div class="weather-box">☀️ 부산 24°C / 맑음</div>
    </div>

    <div class="section">
        <div class="section-title">부산의 이슈</div>

        <div class="news-item">가덕도 신공항 추진</div>
        <div class="news-item">북항 재개발 확대</div>
        <div class="news-item">해양 관광 산업 활성화</div>
        <div class="news-item">청년 일자리 정책 강화</div>
    </div>

    <div class="section">
        <div class="section-title">부경대학교 뉴스</div>

        <div class="grid">
            <div class="card">
                <h3>AI 교육 강화</h3>
                <p>디지털 인재 양성 프로그램 확대</p>
            </div>

            <div class="card">
                <h3>산학협력</h3>
                <p>지역 기업과 공동 연구 진행</p>
            </div>

            <div class="card">
                <h3>국제 교류</h3>
                <p>해외 대학 협력 확대</p>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">사회복지 통계</div>

        <div class="stats">
            <div class="stat">
                <div>노인 인구</div>
                <div class="stat-number">18%</div>
            </div>

            <div class="stat">
                <div>기초생활수급자</div>
                <div class="stat-number">255만</div>
            </div>

            <div class="stat">
                <div>장애인 등록</div>
                <div class="stat-number">264만</div>
            </div>

            <div class="stat">
                <div>복지 예산</div>
                <div class="stat-number">34%</div>
            </div>
        </div>

    </div>

</div>

<footer>
    © 2025 부경대학교의 미래
</footer>

</body>
</html>
